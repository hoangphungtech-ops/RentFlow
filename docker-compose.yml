services:
  mysql:
    image: mysql:8.0
    container_name: rentflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rentflow
    ports:
      - "3307:3306"
    volumes:
      - rentflow_mysql_data:/var/lib/mysql

volumes:
  rentflow_mysql_data:
