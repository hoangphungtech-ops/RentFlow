services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: rentflow
      MYSQL_USER: rentflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol tcp -h 127.0.0.1 -u rentflow rentflow -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 30
  api:
    image: rentflow-api:${RENTFLOW_RELEASE:?required}
    build:
      context: ../backend
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      PUBLIC_ORIGIN: https://${RENTFLOW_DOMAIN:?required}
      TRUST_PROXY_HOPS: 1
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})"]
      interval: 10s
      timeout: 4s
      retries: 12
  migrate:
    image: rentflow-migrate:${RENTFLOW_RELEASE:?required}
    build:
      context: ../backend
      target: migrate
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
  web:
    image: rentflow-web:${RENTFLOW_RELEASE:?required}
    build: ../web
    restart: unless-stopped
  edge:
    image: caddy:2
    restart: unless-stopped
    environment:
      RENTFLOW_DOMAIN: ${RENTFLOW_DOMAIN:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
