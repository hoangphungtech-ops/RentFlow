.eyebrow{color:var(--green);letter-spacing:.11em;font-size:11px;font-weight:850;text-transform:uppercase}.pagehead h1{font-size:29px;line-height:1.25;letter-spacing:-1px;margin:5px 0 7px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid transparent;border-radius:9px;padding:10px 14px;min-height:40px;background:var(--green);color:white;font-weight:750}.btn:hover{filter:brightness(.96)}.btn.ghost{border-color:#cde1d4;color:var(--green);background:white}.btn.soft{color:var(--green);background:#e5f4ea}.btn.danger{color:var(--red);background:#fff0ed}.btn.small{min-height:32px;padding:6px 10px;font-size:12px}.status{display:inline-block;border-radius:99px;font-size:11px;font-weight:800;padding:4px 10px;white-space:nowrap}.status.available,.status.approved,.status.accepted,.status.confirmed{color:#09714f;background:#e5f7ec}.status.pending,.status.waiting{color:#8b640e;background:#fff2d1}.status.declined,.status.rejected{color:#a43d36;background:#feebe8}.status.occupied,.status.maintenance,.status.other{color:#56646a;background:#eef1f2}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:25px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.stat .val{font-weight:850;font-size:28px;line-height:1.25;margin:9px 0 4px;letter-spacing:-.5px}.stat .label{color:#65756d;font-size:12px;font-weight:650}.stat .foot{font-size:11px;color:var(--green)}.card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.filters{display:flex;flex-wrap:wrap;gap:10px;padding:14px;margin-bottom:15px}.field{border:1px solid #d7e2dc;background:white;border-radius:9px;padding:10px 12px;min-height:41px;color:var(--ink);outline-color:#7cae9b}.filterInput{flex:1;min-width:190px}.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.room{overflow:hidden}.roomvisual{height:140px;background:linear-gradient(140deg,#c9e0d5 0%,#b3d5c0 42%,#92c4b1 100%);position:relative;display:grid;place-items:center}.room:nth-child(3n+2) .roomvisual{background:linear-gradient(150deg,#e7e4d4,#bfd3c7)}.room:nth-child(3n+3) .roomvisual{background:linear-gradient(140deg,#bed4dc,#a3c7bb)}.roomglyph{font-size:55px;opacity:.75;filter:drop-shadow(0 6px 6px #3b6c4a30)}.visualtag{position:absolute;top:11px;left:11px;border-radius:8px;padding:4px 7px;background:#ffffffdb;color:#1f4539;font-size:11px;font-weight:750}.roombody{padding:16px}.roomtitle{font-size:16px;font-weight:850}.roombody h3{margin:0;font-size:16px}.roombody p{margin:5px 0}.price{font-weight:850;color:var(--green);font-size:20px;margin:10px 0}.roomend{display:flex;align-items:center;justify-content:space-between;gap:5px;border-top:1px solid var(--line);padding-top:12px}.sectionTitle{margin:17px 0 12px;font-size:17px;letter-spacing:-.4px}.rows{display:grid;gap:11px}.request{padding:16px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.request-main{flex:1;min-width:190px}.request-main h3{font-size:15px;margin:0 0 4px}.request-main p{margin:3px 0}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.empty{padding:30px;text-align:center;border:1px dashed #d0ded5;border-radius:14px;color:var(--muted);background:white}.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:15px}.area{padding:18px}.area h3{margin:0 0 4px}.areahead{display:flex;align-items:center;justify-content:space-between;gap:12px}.metricrow{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.minimetric{background:#f1f6f2;border-radius:8px;padding:8px 10px;font-size:12px}.minimetric b{color:var(--green)}.buildingrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:center}.block{border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:9px}.block summary{font-weight:750;cursor:pointer}.banner{border:1px solid #d8e9dc;border-radius:12px;background:#eaf6ee;padding:15px 18px;display:flex;gap:12px;align-items:center;margin-bottom:18px}.badge{background:#d5eee0;color:var(--green);font-size:10px;padding:3px 7px;border-radius:5px;font-weight:800;letter-spacing:.05em}.inboxrow{padding:16px;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.inboxrow+.inboxrow{border-top:1px solid var(--line)}.inboxrow strong{display:block}.modalWrap{position:fixed;inset:0;background:#0b231bab;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:white;border-radius:17px;padding:25px;box-shadow:0 25px 90px #07140b55}.modal h2{margin:0 0 4px}.modal label{display:block;font-weight:730;font-size:13px;margin-top:14px}.modal label .field{width:100%;display:block;margin-top:6px}.modal textarea{min-height:87px;resize:vertical}.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:25px;bottom:22px;background:#173c2e;color:white;border-radius:12px;padding:13px 18px;box-shadow:0 10px 30px #1117;z-index:30;max-width:400px}.conversation{padding:18px}.bubble{max-width:82%;padding:10px 13px;border-radius:12px;background:#eef3ef;margin:10px 0;font-size:13px}.bubble.mine{background:#def1e4;margin-left:auto}.messagebox{display:flex;gap:8px;margin-top:12px}.messagebox input{flex:1}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pill{font-size:11px;background:#eef2ed;color:#486253;border-radius:12px;padding:4px 8px}.disclaimer{font-size:11px;color:#789083;padding-top:12px}

.room-photo-button{display:block;width:100%;border:0;padding:0;overflow:hidden;border-radius:0;text-align:left;height:clamp(175px,19vw,265px);cursor:zoom-in}

.room-photo-button .visualtag{pointer-events:none}
.photo-dialog{width:min(94vw,760px);max-height:92dvh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink)}

const KEY='rentflow-offline-demo-v1';
const initial=()=>({requests:[{id:'RF-1001',roomId:'PN101',user:'Khách Demo',phone:'',note:'Tôi muốn xem phòng cuối tuần',date:'2026-11-28',status:'PENDING',created:'2026-11-25 09:30'}],outgoing:[],messages:[],properties:[],customRooms:[]});
let state;try{state={...initial(),...JSON.parse(localStorage.getItem(KEY)||'null')}}catch{state=initial()}
let selectedProperty='';
const rooms=()=>[...state.customRooms,...seedRooms];
let role='USER',view='rooms',areaFilter='all',statusFilter='all',search='',modal=null,selectedChat='RF-1001',messageText='';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('vi-VN').format(n)+' đ';
const dt=()=>new Date().toLocaleString('vi-VN');
const normal=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const room=id=>rooms().find(r=>r.id===id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{/* demo still works during this session when browser storage is unavailable */}}
function notify(text){let e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=text;document.body.append(e);setTimeout(()=>e.remove(),3600)}
function statusLabel(s){return ({AVAILABLE:'Còn trống',OCCUPIED:'Đang thuê',MAINTENANCE:'Bảo trì',HELD:'Đã giữ chỗ',PENDING:'Chờ admin duyệt',APPROVED:'Admin đã duyệt',CONFIRMED:'Đã xác nhận đặt phòng',REJECTED:'Đã từ chối',ACCEPTED:'Đồng ý',DECLINED:'Từ chối'}[s]||s)}
function badge(s){return `<span class="status ${['AVAILABLE','APPROVED','ACCEPTED','CONFIRMED'].includes(s)?'available':['PENDING','HELD'].includes(s)?'pending':['REJECTED','DECLINED'].includes(s)?'declined':'other'}">${esc(statusLabel(s))}</span>`}
function statusOfRoom(r){return state.requests.some(q=>q.roomId===r.id&&['APPROVED','CONFIRMED'].includes(q.status))?'HELD':r.status}
function setRole(r){role=r;view=r==='USER'?'rooms':r==='ADMIN'?'requests':'areas';areaFilter='all';statusFilter='all';search='';render()}
function setView(v){view=v;render()}
function roomCards(){const filtered=rooms().filter(r=>{const status=statusOfRoom(r);return(areaFilter==='all'||r.area===areaFilter)&&(statusFilter==='all'||status===statusFilter)&&normal(r.name+' '+r.house+' '+r.area+' '+r.cluster+' '+r.code+' '+(r.propertyName||'')).includes(normal(search))});return `<div class="card filters"><input aria-label="Tìm phòng" class="field filterInput" placeholder="🔎 Tìm phòng, tuyến đường, khu vực…" value="${esc(search)}" oninput="search=this.value;paintResults()"><select aria-label="Khu vực" class="field" onchange="areaFilter=this.value;paintResults()"><option value="all">Tất cả khu vực</option>${[...new Set(properties().map(p=>p.area))].map(x=>`<option ${areaFilter===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Trạng thái" class="field" onchange="statusFilter=this.value;paintResults()"><option value="all">Mọi trạng thái</option>${[['AVAILABLE','Còn trống'],['HELD','Đã giữ chỗ'],['OCCUPIED','Đang thuê'],['MAINTENANCE','Bảo trì']].map(([v,t])=>`<option value="${v}" ${statusFilter===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="roomResults">${buildRoomResults(filtered)}</div>`}
function properties(){
  const seeded=new Map();
  for(const r of seedRooms){
    const id='seed-'+r.house+'|'+r.area;
    seeded.set(id,{id,name:r.house,house:r.house,street:r.street,area:r.area,cluster:r.cluster});
  }
  return [...seeded.values(),...state.properties];
}

function saveCatalog(next){
  localStorage.setItem(KEY,JSON.stringify(next));
  state=next;
}

function propertyOptions(){
  return properties().map(p=>`<option value="${esc(p.id)}" ${p.id===selectedProperty?'selected':''}>${esc(p.name)} · ${esc(p.area)}</option>`).join('');
}

function catalogView(){
  if(role!=='ADMIN')return '';
  return `<div class="cols">
  <section class="card area"><h2>Thêm khu trọ</h2>
  <form class="catalog-form" onsubmit="addProperty(event)">
    <label>Tên khu trọ<input class="field" name="name" maxlength="100" required></label>
    <label>Số nhà và tên đường<input class="field" name="house" maxlength="120" required placeholder="Ví dụ: 18 Nguyễn Xí"></label>
    <label>Tên đường<input class="field" name="street" maxlength="80" required></label>
    <label>Khu vực<input class="field" name="area" list="catalogAreas" maxlength="80" required></label>
    <datalist id="catalogAreas">${[...new Set(properties().map(p=>p.area))].map(a=>`<option value="${esc(a)}"></option>`).join('')}</datalist>
    <label>Cụm vận hành (tùy chọn)<input class="field" name="cluster" maxlength="80"></label>
    <button class="btn">Lưu khu trọ</button>
  </form></section>
  <section class="card area"><h2>Thêm phòng và ảnh</h2>
  <form class="catalog-form" onsubmit="addRoom(event)">
    <label>Khu trọ<select class="field" name="propertyId" required><option value="">Chọn khu trọ</option>${propertyOptions()}</select></label>
    <label>Mã phòng<input class="field" name="code" maxlength="24" required></label>
    <label>Tên phòng hiển thị<input class="field" name="name" maxlength="100" required></label>
    <label>Giá thuê (đ/tháng)<input class="field" name="price" type="number" min="0" max="999999999" step="1" required></label>

    <button class="btn">Lưu phòng</button>
  </form></section>
  </div>`;
}

function addProperty(event){
  event.preventDefault();
  if(role!=='ADMIN')return;
  const d=new FormData(event.currentTarget);
  const field=name=>String(d.get(name)||'').trim();
  const name=field('name'),house=field('house'),street=field('street'),area=field('area');
  if(!name||!house||!street||!area)return notify('Nhập đủ tên khu, địa chỉ, đường và khu vực.');
  if(properties().some(p=>normal(p.area)===normal(area)&&normal(p.house)===normal(house)))return notify('Địa chỉ này đã có. Hãy chọn khu trọ hiện có để thêm phòng.');
  const property={id:'K-'+makeCatalogId(),name,house,street,area,cluster:field('cluster')||street};
  try{saveCatalog({...state,properties:[...state.properties,property]});}
  catch{notify('Không thể lưu khu trọ trên trình duyệt này.');return;}
  selectedProperty=property.id;
  render();
  notify('Đã thêm khu trọ. Có thể tạo phòng ngay.');
}

function makeCatalogId(){
  return globalThis.crypto?.randomUUID?.() || Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
}

function photosFor(r){
  return r.photos?.length?r.photos:roomPhotos[r.id]?[roomPhotos[r.id]]:[];
}

async function resizeRoomPhoto(file,name,index){
  if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024)throw Error('Mỗi ảnh phải là JPG, PNG hoặc WebP tối đa 8 MB.');
  let bitmap;
  try{bitmap=await createImageBitmap(file);}
  catch{throw Error('Không đọc được một ảnh. Hãy chọn lại ảnh đúng định dạng.');}
  try{
    const canvas=document.createElement('canvas'),scale=Math.min(1,1050/Math.max(bitmap.width,bitmap.height));
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));
    canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
    return {src:canvas.toDataURL('image/jpeg',0.76),alt:name+' · Ảnh '+(index+1)};
  }finally{bitmap.close();}
}

async function addRoom(event){
  event.preventDefault();
  if(role!=='ADMIN')return;
  const form=event.currentTarget,d=new FormData(form),field=name=>String(d.get(name)||'').trim();
  const property=properties().find(p=>p.id===field('propertyId'));
  const code=field('code').toUpperCase(),name=field('name'),price=Number(field('price')),areaSqm=Number(field('areaSqm'));
  if(!property||!code||!name||!field('price')||!Number.isInteger(price)||price<0||price>999999999||!Number.isFinite(areaSqm)||areaSqm<1||areaSqm>10000)return notify('Kiểm tra lại khu trọ, mã, tên phòng, giá và diện tích.');
  const duplicate=r=>normal(r.code)===normal(code)&&normal(r.area)===normal(property.area)&&normal(r.house)===normal(property.house);
  if(rooms().some(duplicate))return notify('Mã phòng đã tồn tại tại khu trọ này.');
  const files=d.getAll('photos').filter(file=>file.size>0);
  if(files.length>3)return notify('Chọn tối đa 3 ảnh cho mỗi phòng.');
  const submit=form.querySelector('button[type="submit"], button');
  submit.disabled=true;
  try{
    const photos=await Promise.all(files.map((file,i)=>resizeRoomPhoto(file,name,i)));
    if(role!=='ADMIN'||!form.isConnected)return;
    if(rooms().some(duplicate))return notify('Mã phòng đã tồn tại tại khu trọ này.');
    const added={id:'P-'+makeCatalogId(),propertyId:property.id,propertyName:property.name,house:property.house,street:property.street,area:property.area,cluster:property.cluster,code,name,price,areaSqm,photos,status:'AVAILABLE',debt:0};
    saveCatalog({...state,customRooms:[added,...state.customRooms]});
    view='rooms';areaFilter='all';statusFilter='all';search=code;
    render();
    notify('Đã lưu phòng. Cả ba vai trò có thể xem.');
  }catch(error){
    notify(error.name==='QuotaExceededError'?'Bộ nhớ demo đã đầy. Hãy lưu phòng với ít ảnh hơn.':error.message||'Không thể lưu phòng.');
  }finally{submit.disabled=false;}
}

let galleryRoom=null,galleryIndex=0;
function roomVisual(r,index){
  const photos=photosFor(r),cover=photos[0];
  if(!cover)return `<div class="roomvisual"><span class="visualtag">Chưa có ảnh · ${esc(r.area)}</span><span class="roomglyph" aria-hidden="true">${['🏠','🏘️','🏡'][index%3]}</span></div>`;
  const label=r.photos?.length?'Xem ảnh':'Xem ảnh minh họa';
  return `<button class="roomvisual room-photo-button" type="button" aria-label="${label} ${esc(r.name)}" onclick="openRoomPhoto('${r.id}')"><img src="${cover.src}" alt="${esc(cover.alt)}" loading="lazy"><span class="visualtag">${r.photos?.length?photos.length+' ảnh phòng':'Ảnh minh họa'} · Bấm để xem</span></button>`;
}
function showRoomPhoto(){
  const photos=photosFor(galleryRoom),photo=photos[galleryIndex];
  const image=document.getElementById('roomPhotoFull');
  image.src=photo.src;
  image.alt=photo.alt;
  document.getElementById('roomPhotoCaption').textContent=galleryRoom.photos?.length?'Ảnh do Admin / Chủ trọ cung cấp trong bản demo.':'Ảnh minh họa nội thất dùng trong bản demo.';
  document.getElementById('roomPhotoCounter').textContent=(galleryIndex+1)+' / '+photos.length;
  document.getElementById('roomPhotoPrev').disabled=galleryIndex===0;
  document.getElementById('roomPhotoNext').disabled=galleryIndex===photos.length-1;
}
function openRoomPhoto(roomId){
  const selectedRoom=room(roomId);
  if(!selectedRoom||!photosFor(selectedRoom).length)return;
  galleryRoom=selectedRoom;
  galleryIndex=0;
  document.getElementById('roomPhotoTitle').textContent=selectedRoom.name+' · '+selectedRoom.code;
  showRoomPhoto();
  document.getElementById('roomPhotoDialog').showModal();
}
function stepRoomPhoto(step){
  const next=galleryIndex+step;
  if(!galleryRoom||next<0||next>=photosFor(galleryRoom).length)return;
  galleryIndex=next;
  showRoomPhoto();
}
function buildRoomResults(filtered){return filtered.length?`<div class="rooms">${filtered.map((r,i)=>`<article class="card room">${roomVisual(r,i)}<div class="roombody"><div class="toolbar" style="justify-content:space-between"><span class="small muted">${esc(r.house)} · ${esc(r.area)}</span>${badge(statusOfRoom(r))}</div><h3 style="margin-top:10px">${esc(r.name)}</h3><p class="muted small">${esc(r.code)} · ${r.areaSqm} m² · ${esc(r.cluster)}</p><div class="price">${fmt(r.price)}<span class="small muted" style="font-weight:400">/tháng</span></div><div class="roomend"><span class="small muted">${esc(r.propertyName||"Giá demo")}</span>${role==='USER'?`<button class="btn small" ${statusOfRoom(r)!=='AVAILABLE'?'disabled':''} onclick="openBooking('${r.id}')">Gửi yêu cầu xem/đặt phòng</button>`:''}</div></div></article>`).join('')}</div>`:'<div class="empty">Không tìm thấy phòng phù hợp. Hãy đổi bộ lọc.</div>'}
function paintResults(){const el=document.getElementById('roomResults');if(el){el.innerHTML=buildRoomResults(rooms().filter(r=>(areaFilter==='all'||r.area===areaFilter)&&(statusFilter==='all'||statusOfRoom(r)===statusFilter)&&normal(r.name+' '+r.house+' '+r.area+' '+r.cluster+' '+r.code+' '+(r.propertyName||'')).includes(normal(search))))}}
function openBooking(id){let r=room(id);if(!r||statusOfRoom(r)!=='AVAILABLE')return notify('Phòng hiện không nhận yêu cầu mới.');modal={kind:'booking',roomId:id};renderModal()}
function submitBooking(ev){ev.preventDefault();const fd=new FormData(ev.target),id=modal.roomId,r=room(id);if(statusOfRoom(r)!=='AVAILABLE')return notify('Phòng đã có thay đổi trạng thái.');if(state.requests.some(q=>q.roomId===id&&q.user==='Khách Demo'&&['PENDING','APPROVED','CONFIRMED'].includes(q.status)))return notify('Bạn đã có yêu cầu đang xử lý cho phòng này.');state.requests.unshift({id:'RF-'+String(Date.now()).slice(-8),roomId:id,user:'Khách Demo',phone:String(fd.get('phone')||''),note:String(fd.get('note')||''),date:String(fd.get('date')||''),status:'PENDING',created:dt()});save();closeModal();view='requests';render();notify('Đã gửi yêu cầu đến Admin. Đây là dữ liệu demo, chưa đặt phòng thật.')}
function approve(id){const q=state.requests.find(x=>x.id===id);if(!q||q.status!=='PENDING')return;if(statusOfRoom(room(q.roomId))!=='AVAILABLE'){return notify('Phòng không còn trống. Không thể duyệt.')}q.status='APPROVED';q.reviewedAt=dt();save();render();notify('Admin đã duyệt. Đang chờ người dùng xác nhận.')}
function reject(id){const q=state.requests.find(x=>x.id===id);if(!q||q.status!=='PENDING')return;q.status='REJECTED';q.reviewedAt=dt();save();render();notify('Đã từ chối và ghi nhận lịch sử yêu cầu.')}
function confirmBooking(id){const q=state.requests.find(x=>x.id===id);if(q?.status!=='APPROVED')return;q.status='CONFIRMED';q.confirmedAt=dt();save();render();notify('Đã xác nhận đặt phòng trong demo. Chưa phát sinh hợp đồng hoặc thanh toán thật.')}
function createOutgoing(ev){ev.preventDefault();let d=new FormData(ev.target),rid=String(d.get('roomId')||'');state.outgoing.unshift({id:'AD-'+String(Date.now()).slice(-8),roomId:rid,kind:String(d.get('kind')),note:String(d.get('note')),status:'PENDING',created:dt()});save();closeModal();view='outgoing';render();notify('Đã gửi yêu cầu từ Admin đến User trong demo.')}
function replyOutgoing(id,status){let o=state.outgoing.find(x=>x.id===id);if(o?.status!=='PENDING')return;o.status=status;o.repliedAt=dt();save();render();notify(status==='ACCEPTED'?'Người dùng đã đồng ý yêu cầu.':'Người dùng đã từ chối yêu cầu.')}
function sendMessage(ev){ev.preventDefault();const value=String(new FormData(ev.target).get('text')||'').trim();if(!value)return;state.messages.push({id:'M'+Date.now(),requestId:selectedChat,from:role==='USER'?'USER':'ADMIN',text:value,created:dt()});save();render()}
function resetDemo(){if(confirm('Đặt lại toàn bộ dữ liệu demo? Không ảnh hưởng MySQL hoặc GitHub.')){state=initial();selectedProperty='';save();render();notify('Đã đặt lại dữ liệu demo.')}}
function requestRows(){if(!state.requests.length)return '<div class="empty">Chưa có yêu cầu đặt phòng.</div>';return `<div class="rows">${state.requests.map(q=>{const r=room(q.roomId);const acts=role==='USER'?(q.status==='APPROVED'?`<button class="btn small" onclick="confirmBooking('${q.id}')">Xác nhận đặt phòng</button>`:''):(role==='ADMIN'&&q.status==='PENDING'?`<button class="btn small" onclick="approve('${q.id}')">Duyệt</button><button class="btn danger small" onclick="reject('${q.id}')">Từ chối</button>`:'');return `<article class="card request"><div class="request-main"><div class="toolbar">${badge(q.status)} <span class="pill">${esc(q.id)}</span></div><h3 style="margin-top:7px">${esc(r.name)} · ${esc(r.code)}</h3><p class="muted small">${role==='USER'?'Yêu cầu của bạn':esc(q.user)+' · '+(q.phone?esc(q.phone)+' · ':'')}${esc(r.street)}, ${esc(r.area)}</p><p class="small">Ngày muốn xem: <strong>${esc(q.date||'Chưa chọn')}</strong> · ${esc(q.note||'Không có ghi chú')}</p><p class="muted small">Tạo: ${esc(q.created)}${q.reviewedAt?' · Admin xử lý: '+esc(q.reviewedAt):''}</p></div><div class="actions">${acts}<button class="btn ghost small" onclick="selectedChat='${q.id}';view='chat';render()">Trao đổi</button></div></article>`}).join('')}</div>`}
function outgoingRows(){return state.outgoing.length?`<div class="rows">${state.outgoing.map(o=>{const r=room(o.roomId);return `<article class="card request"><div class="request-main"><div class="toolbar">${badge(o.status)} <span class="pill">Admin → User</span></div><h3 style="margin-top:8px">${esc(o.kind)} · ${esc(r?.name||'Chung')}</h3><p>${esc(o.note)}</p><p class="muted small">${esc(o.created)}</p></div>${role==='USER'&&o.status==='PENDING'?`<div class="actions"><button class="btn small" onclick="replyOutgoing('${o.id}','ACCEPTED')">Đồng ý</button><button class="btn ghost small" onclick="replyOutgoing('${o.id}','DECLINED')">Từ chối</button></div>`:''}</article>`}).join('')}</div>`:'<div class="empty">Chưa có yêu cầu nào từ Admin gửi đến User.</div>'}
function chatView(){const q=state.requests.find(x=>x.id===selectedChat)||state.requests[0];if(!q)return '<div class="empty">Hãy tạo một yêu cầu trước để bắt đầu trao đổi.</div>';selectedChat=q.id;let rr=room(q.roomId);return `<div class="cols"><section class="card conversation"><h3>Trao đổi về ${esc(rr.name)}</h3><p class="muted small">Mã yêu cầu ${esc(q.id)} · Admin ↔ User · Lưu trong trình duyệt</p><div style="min-height:180px;max-height:370px;overflow:auto">${state.messages.filter(m=>m.requestId===q.id).map(m=>`<div class="bubble ${m.from===role?'mine':''}"><b>${m.from==='USER'?'Người tìm phòng':'Admin'}</b><div>${esc(m.text)}</div><span class="small muted">${esc(m.created)}</span></div>`).join('')||'<p class="muted small" style="margin-top:28px">Chưa có tin nhắn. Hãy bắt đầu trao đổi để làm rõ lịch hẹn hoặc yêu cầu.</p>'}</div><form class="messagebox" onsubmit="sendMessage(event)"><input class="field" name="text" maxlength="500" required placeholder="Nhập nội dung trao đổi…" aria-label="Nội dung tin nhắn"><button class="btn">Gửi</button></form></section><section class="card area"><h3>Yêu cầu liên quan</h3>${state.requests.map(x=>`<div class="buildingrow"><div><strong>${esc(x.id)}</strong><p class="small muted">${esc(room(x.roomId).name)} · ${esc(statusLabel(x.status))}</p></div><button class="btn ghost small" onclick="selectedChat='${x.id}';render()">Mở</button></div>`).join('')}</section></div>`}
function areasView(){return `<div class="stats">${[['Khu vực quản lý',String(new Set(properties().map(p=>p.area)).size)],['Cơ sở',String(properties().length)],['Tổng số phòng',String(rooms().length)],['Công nợ mô phỏng',fmt(rooms().reduce((s,r)=>s+r.debt,0))]].map(([l,v])=>`<div class="stat"><div class="label">${l}</div><div class="val">${v}</div><div class="foot">Dữ liệu mẫu</div></div>`).join('')}</div><div class="cols"><div class="rows">${[...new Set(properties().map(p=>p.area))].map(a=>{let rs=rooms().filter(r=>r.area===a);let groups=[...new Set(rs.map(r=>r.cluster))];return `<section class="card area"><div class="areahead"><div><h3>📍 ${esc(a)}</h3><p class="muted small">${groups.length} cụm vận hành · ${properties().filter(p=>p.area===a).length} cơ sở</p></div><span class="badge">${rs.length} phòng</span></div><div class="metricrow"><span class="minimetric">Trống: <b>${rs.filter(r=>statusOfRoom(r)==='AVAILABLE').length}</b></span><span class="minimetric">Đã thuê: <b>${rs.filter(r=>r.status==='OCCUPIED').length}</b></span><span class="minimetric">Công nợ: <b>${fmt(rs.reduce((s,r)=>s+r.debt,0))}</b></span></div>${groups.map(g=>`<details class="block"><summary>${esc(g)} · ${rs.filter(r=>r.cluster===g).length} phòng</summary>${rs.filter(r=>r.cluster===g).map(r=>`<div class="buildingrow"><div><strong>${esc(r.house)} / ${esc(r.code)}</strong><p class="small muted">${esc(r.name)} · ${statusLabel(statusOfRoom(r))} · Công nợ: ${fmt(r.debt)}</p></div>${photosFor(r).length?`<button class="btn ghost small" onclick="openRoomPhoto('${r.id}')">Xem ảnh ${esc(r.code)}</button>`:''}</div>`).join('')}</details>`).join('')}</section>`}).join('')}</div><div><section class="card area"><h3>Yêu cầu cần xử lý</h3><div class="metricrow"><span class="minimetric">Đặt phòng chờ: <b>${state.requests.filter(q=>q.status==='PENDING').length}</b></span><span class="minimetric">User chờ xác nhận: <b>${state.requests.filter(q=>q.status==='APPROVED').length}</b></span></div><p class="small muted">Giao diện quản lý chỉ hiển thị thông tin chi tiết trong môi trường vận hành có phân quyền. Địa chỉ và công nợ ở đây đều là ví dụ.</p><button class="btn ghost small" onclick="setRole('ADMIN');setView('requests')">Mở xử lý yêu cầu</button></section><section class="card area"><h3>Nguyên tắc minh bạch</h3><p class="small">Yêu cầu phải có trạng thái, lịch sử và người xử lý. Đặt phòng không đồng nghĩa đã thanh toán hoặc ký hợp đồng. Dữ liệu thật cần xác thực, phân quyền và audit trên máy chủ.</p></section></div></div>`}

view==='requests'?requestRows():view==='outgoing'?outgoingRows():view==='overview'?overview():view==='areas'?areasView():chatView()}<div class="disclaimer">© RentFlow prototype · Không dùng dữ liệu thật, không tích hợp thanh toán, không thay đổi repository.</div></main></div></div>`;if(modal)renderModal()}
function renderModal(){const old=document.getElementById('modalLayer');if(old)old.remove();if(!modal)return;let html=modal.kind==='booking'?`<h2>Gửi yêu cầu xem / đặt phòng</h2><p class="muted small">${esc(room(modal.roomId).name)} · ${esc(room(modal.roomId).street)}, ${esc(room(modal.roomId).area)} · ${fmt(room(modal.roomId).price)}/tháng</p><form onsubmit="submitBooking(event)"><label>Ngày muốn xem phòng<input class="field" type="date" name="date" required value="2026-11-28"></label><label>Số điện thoại liên hệ (không bắt buộc trong demo)<input class="field" type="tel" name="phone" maxlength="15" placeholder="Nhập số liên hệ"></label><label>Lời nhắn đến Admin<textarea class="field" name="note" maxlength="500" placeholder="Ví dụ: Tôi muốn xem phòng vào chiều thứ bảy"></textarea></label><p class="muted small">Yêu cầu chỉ được gửi đến bảng quản trị trong bản demo, không giữ chỗ và không thu tiền cho đến khi được duyệt và xác nhận.</p><div class="modalFoot"><button type="button" class="btn ghost" onclick="closeModal()">Hủy</button><button class="btn">Gửi yêu cầu</button></div></form>`:`<h2>Admin gửi yêu cầu đến User</h2><p class="muted small">Yêu cầu sẽ xuất hiện trong cổng Người dùng để họ đồng ý hoặc từ chối.</p><form onsubmit="createOutgoing(event)"><label>Liên quan đến phòng<select name="roomId" class="field" required>${rooms().map(r=>`<option value="${r.id}">${esc(r.name)} · ${esc(r.code)}</option>`).join('')}</select></label><label>Loại yêu cầu<select name="kind" class="field"><option>Xác nhận lịch xem phòng</option><option>Bổ sung thông tin đặt phòng</option><option>Xác nhận thông tin hợp đồng dự kiến</option><option>Hẹn xử lý bảo trì</option></select></label><label>Nội dung yêu cầu<textarea name="note" class="field" required maxlength="500" placeholder="Ví dụ: Vui lòng xác nhận lịch xem phòng lúc 15:00 thứ bảy"></textarea></label><div class="modalFoot"><button type="button" class="btn ghost" onclick="closeModal()">Hủy</button><button class="btn">Gửi tới User</button></div></form>`;const div=document.createElement('div');div.id='modalLayer';div.className='modalWrap';div.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Yêu cầu">${html}</div>`;div.addEventListener('click',ev=>{if(ev.target===div)closeModal()});document.body.append(div)}
function closeModal(){modal=null;document.getElementById('modalLayer')?.remove()}
render();
</script>
