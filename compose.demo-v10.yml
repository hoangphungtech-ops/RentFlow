name: rentflow-v10-phung-demo

x-demo-database: &demo-database mysql://rentflow:RentFlow2511DemoDB@mysql:3306/rentflow_v10_demo

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: RentFlow2511DemoRoot
      MYSQL_DATABASE: rentflow_v10_demo
      MYSQL_USER: rentflow
      MYSQL_PASSWORD: RentFlow2511DemoDB
    volumes:
      - rentflow_v10_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol tcp -h 127.0.0.1 -u rentflow rentflow_v10_demo -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 40

  prepare:
    image: rentflow-v10-backend:demo
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: *demo-database
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@2026!}
      RENTFLOW_V10_DEMO: "1"
      NODE_ENV: development
    command:
      - sh
      - -ec
      - |
        ./node_modules/.bin/prisma migrate deploy
        if [ ! -f /app/uploads/.v9-seeded ]; then
          node dist/prisma/seed.js
          touch /app/uploads/.v9-seeded
        fi
        node dist/prisma/seed-v10.js
        node dist/prisma/seed-rbac.js
        node dist/prisma/seed-rotate-demo-password.js
    volumes:
      - rentflow_v10_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  api:
    image: rentflow-v10-backend:demo
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: *demo-database
      RENTFLOW_V10_DEMO: "1"
      API_HOST: 0.0.0.0
      NODE_ENV: development
      UPLOAD_DIR: /app/uploads
    command: ["node", "dist/src/main.js"]
    volumes:
      - rentflow_v10_uploads:/app/uploads
    depends_on:
      prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})"]
      interval: 5s
      timeout: 4s
      retries: 30

  web:
    build:
      context: ./web
      args:
        RENTFLOW_API_ORIGIN: http://api:3001
    ports:
      - "127.0.0.1:32512:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})"]
      interval: 5s
      timeout: 4s
      retries: 30

volumes:
  rentflow_v10_mysql:
  rentflow_v10_uploads:
